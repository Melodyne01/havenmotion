# Environnement de développement : Postgres + MinIO + Mailpit + API.
# Le front tourne en local : `cd apps/web && npm start` (proxy vers l'API).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: studiovnl
      POSTGRES_USER: studiovnl
      POSTGRES_PASSWORD: studiovnl
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U studiovnl']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: vnl-dev
      MINIO_ROOT_PASSWORD: vnl-dev-secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '1025:1025'
      - '8025:8025'

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=studiovnl;Username=studiovnl;Password=studiovnl
      Email__Host: mailpit
      Email__Port: '1025'
      Seed__AdminEmail: admin@studiovnl.fr
      Seed__AdminPassword: Admin-Demo-2026!
      MediaStorage__Provider: LocalDisk
      MediaStorage__LocalDisk__RootPath: /data/media
      Cors__AllowedOrigins__0: http://localhost:4200
    ports:
      - '5080:5080'
    volumes:
      - media-data:/data/media

volumes:
  postgres-data:
  minio-data:
  media-data:
