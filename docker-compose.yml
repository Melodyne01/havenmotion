# Environnement de développement : Postgres + MinIO + Mailpit + API.
# Le front tourne en local : `cd apps/web && npm start` (proxy vers l'API).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: studiovnl
      POSTGRES_USER: studiovnl
      POSTGRES_PASSWORD: studiovnl
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U studiovnl']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: vnl-dev
      MINIO_ROOT_PASSWORD: vnl-dev-secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '1025:1025'
      - '8025:8025'

  # Rend le volume des médias inscriptible par l'API (utilisateur non-root
  # `app`, uid 1654) : un volume créé avant que l'image ne pose ces droits
  # restait root:root et chaque envoi de fichier finissait en erreur 500.
  media-permissions:
    # uid 1654 = utilisateur `app` des images .NET officielles.
    image: alpine:3.20
    user: '0'
    entrypoint: ['chown', '-R', '1654:1654', '/data/media']
    restart: 'no'
    volumes:
      - media-data:/data/media

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      # Clé ImageSharp exigée par le build Release : `export SIXLABORS_LICENSE_KEY=…` avant `docker compose up`.
      secrets:
        - sixlabors_license
    depends_on:
      postgres:
        condition: service_healthy
      media-permissions:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=studiovnl;Username=studiovnl;Password=studiovnl
      Email__Host: mailpit
      Email__Port: '1025'
      Seed__AdminEmail: admin@heavenmotion.be
      MediaStorage__Provider: LocalDisk
      MediaStorage__LocalDisk__RootPath: /data/media
      Cors__AllowedOrigins__0: http://localhost:4200
    ports:
      - '5080:5080'
    volumes:
      - media-data:/data/media

secrets:
  sixlabors_license:
    environment: SIXLABORS_LICENSE_KEY

volumes:
  postgres-data:
  minio-data:
  media-data:
