name: Deploy stack

# Mécanique de déploiement partagée entre la prod (deploy.yml) et la dev
# (deploy-dev.yml). Les images sont construites sur le runner puis livrées au
# VPS par docker save/load (couches déjà présentes non renvoyées) ; le
# serveur ne fait que les charger et démarrer.
#
# Pré-requis côté dépôt : secret VPS_SSH_KEY (clé privée SSH du compte deploy).
# Pré-requis côté serveur : Docker + plugin compose ; le reverse proxy de
# l'hôte pointe vers 127.0.0.1:<web_port>.
on:
  workflow_call:
    inputs:
      env_name:
        description: "Nom lisible de l'environnement (production, dev…)"
        required: true
        type: string
      deploy_path:
        description: "Dossier de la pile sur le VPS"
        required: true
        type: string
      site_url:
        description: "URL publique vérifiée en fin de déploiement"
        required: true
        type: string
      site_origin:
        description: "Origine publique (https://…, sans / final)"
        required: true
        type: string
      allowed_hosts:
        description: "Hosts acceptés par le serveur SSR (séparés par des virgules)"
        required: true
        type: string
      image_tag:
        description: "Tag des images Docker (prod, dev…)"
        required: true
        type: string
      web_port:
        description: "Port hôte (127.0.0.1) exposé par le conteneur web"
        required: true
        type: string

jobs:
  deploy:
    name: Déployer ${{ inputs.env_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      DEPLOY_HOST: 195.35.1.21
      DEPLOY_USER: deploy
      DEPLOY_PATH: ${{ inputs.deploy_path }}
      DEPLOY_URL: ${{ inputs.site_url }}
      SITE_ORIGIN: ${{ inputs.site_origin }}
      ALLOWED_HOSTS: ${{ inputs.allowed_hosts }}
      IMAGE_TAG: ${{ inputs.image_tag }}
      WEB_PORT: ${{ inputs.web_port }}
      # Dossiers d'images des deux environnements (couches partagées).
      IMAGE_SHARE_DIRS: /opt/havenmotion/.images /home/deploy/havenmotion-dev/.images
    steps:
      - uses: actions/checkout@v4

      - name: Préparer la clé SSH
        run: |
          if [ -z "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "::error::Le secret VPS_SSH_KEY est absent ou vide."
            echo "::error::Ajoutez la clé privée SSH du compte de déploiement dans"
            echo "::error::Settings → Secrets and variables → Actions → New repository secret."
            exit 1
          fi
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Synchroniser les sources vers le VPS
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH'"
          rsync -az --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='dist' \
            --exclude='.env' \
            --exclude='BACKOFFICE-ACCES.txt' \
            --exclude='.images/' \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

      # Premier passage : génère le .env sur le serveur (secrets créés sur
      # place, jamais dans les logs). Le backoffice démarre sur le compte admin
      # par défaut (README, « Comptes de démo ») : son mot de passe est à
      # changer à la première connexion.
      # Passages suivants : les secrets sont conservés, seules les valeurs
      # dérivées du domaine/environnement sont réalignées. L'ancien mot de
      # passe admin aléatoire (ADMIN_PASSWORD, BACKOFFICE-ACCES.txt) est retiré :
      # le compte bascule sur le mot de passe par défaut tant qu'il n'a pas été
      # changé depuis le backoffice. ADMIN_RESET_PASSWORD est à usage unique :
      # resté à true, il écrasait à chaque déploiement le mot de passe choisi.
      # Il est donc retiré ; pour s'en servir, l'ajouter puis relancer la pile
      # à la main (docker compose up -d), le déploiement suivant l'enlèvera.
      - name: Préparer l'environnement serveur
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' SITE_ORIGIN='$SITE_ORIGIN' ALLOWED_HOSTS='$ALLOWED_HOSTS' IMAGE_TAG='$IMAGE_TAG' WEB_PORT='$WEB_PORT' bash -s" <<'REMOTE'
          set -eu
          cd "$DEPLOY_PATH"
          if [ -f .env ]; then
            sed -i \
              -e "s|^SITE_ORIGIN=.*|SITE_ORIGIN=$SITE_ORIGIN|" \
              -e "s|^ALLOWED_HOSTS=.*|ALLOWED_HOSTS=$ALLOWED_HOSTS|" \
              -e '/^ADMIN_PASSWORD=/d' \
              -e '/^ADMIN_RESET_PASSWORD=/d' \
              .env
            rm -f BACKOFFICE-ACCES.txt
            # Compte admin : adresse Heaven Motion partout. L'API renomme au
            # démarrage l'ancien compte admin@studiovnl.fr (mot de passe et rôle
            # conservés) quand ADMIN_EMAIL change.
            for kv in "IMAGE_TAG=$IMAGE_TAG" "WEB_PORT=$WEB_PORT" "ADMIN_EMAIL=admin@heavenmotion.be"; do
              key="${kv%%=*}"
              if grep -q "^$key=" .env; then
                sed -i "s|^$key=.*|$kv|" .env
              else
                printf '%s\n' "$kv" >> .env
              fi
            done
            echo ".env déjà présent : valeurs d'environnement réalignées."
            exit 0
          fi
          cat > .env <<ENV
          POSTGRES_PASSWORD=$(openssl rand -hex 24)
          JWT_SIGNING_KEY=$(openssl rand -base64 48 | tr -d '\n')
          SMTP_HOST=localhost
          SMTP_PORT=587
          SMTP_USERNAME=
          SMTP_PASSWORD=
          MAIL_FROM=no-reply@heavenmotion.be
          ADMIN_EMAIL=admin@heavenmotion.be
          SITE_ORIGIN=$SITE_ORIGIN
          ALLOWED_HOSTS=$ALLOWED_HOSTS
          IMAGE_TAG=$IMAGE_TAG
          WEB_PORT=$WEB_PORT
          ENV
          chmod 600 .env
          echo ".env généré ; backoffice sur le compte admin par défaut (à changer à la 1re connexion)."
          REMOTE

      # Les images sont construites sur le runner (machine puissante) puis
      # livrées au VPS : le petit serveur n'a plus qu'à les charger et les
      # démarrer — pas de compilation Angular/.NET sur place.
      # Cache de build GitHub Actions : une couche inchangée (FFmpeg, image de
      # base…) ressort à l'identique d'un déploiement à l'autre, et n'a donc
      # pas à être renvoyée au VPS (voir l'étape suivante).
      - uses: docker/setup-buildx-action@v3

      - name: Construire l'image API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          tags: vnl-api:${{ inputs.image_tag }}
          load: true
          # Clé de licence ImageSharp (Six Labors), voir README.
          secrets: sixlabors_license=${{ secrets.SIXLABORS_LICENSE_KEY }}
          cache-from: type=gha,scope=vnl-api
          cache-to: type=gha,scope=vnl-api,mode=max

      - name: Construire l'image web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web.Dockerfile
          tags: vnl-web:${{ inputs.image_tag }}
          load: true
          cache-from: type=gha,scope=vnl-web
          cache-to: type=gha,scope=vnl-web,mode=max

      # Livraison couche par couche. `docker save` produit un dossier OCI où
      # chaque couche est un fichier nommé par son empreinte : le VPS garde ce
      # dossier (.images/) d'un déploiement à l'autre et rsync n'envoie que les
      # couches absentes — quelques dizaines de Mo au lieu de ~300 Mo
      # d'archive complète, qui ne passaient plus quand le lien vers le VPS
      # ralentissait. Un transfert coupé reprend où il s'était arrêté
      # (--partial-dir), y compris au déploiement suivant.
      - name: Livrer les images au VPS
        timeout-minutes: 35
        run: |
          SSH="ssh -i $HOME/.ssh/deploy_key -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o ConnectTimeout=20"
          rm -rf /tmp/images && mkdir -p /tmp/images
          docker save "vnl-api:$IMAGE_TAG" "vnl-web:$IMAGE_TAG" | tar -x -C /tmp/images
          echo "Images : $(du -sh /tmp/images | cut -f1) (non compressées)"

          # Premier passage : le dossier du VPS est amorcé avec les images
          # déjà chargées, pour ne pas renvoyer les couches qu'il possède.
          $SSH "$DEPLOY_USER@$DEPLOY_HOST" "cd '$DEPLOY_PATH' && rm -f .images.tar.gz && \
            if [ ! -d .images/blobs ]; then \
              rm -rf .images && mkdir -p .images && \
              (docker save vnl-api:$IMAGE_TAG vnl-web:$IMAGE_TAG 2>/dev/null | tar -x -C .images || true); \
              chmod -R u+w .images; echo \"Dossier d'images amorcé : \$(du -sh .images | cut -f1)\"; \
            fi"

          # Dev et prod partagent le cache de build, donc les mêmes couches :
          # celles déjà livrées à l'autre environnement sont reprises sur
          # place (liens durs, même disque) au lieu d'être renvoyées.
          $SSH "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH/.images/blobs/sha256' && \
            for d in $IMAGE_SHARE_DIRS; do \
              [ \"\$d\" != '$DEPLOY_PATH/.images' ] && [ -d \"\$d/blobs/sha256\" ] && \
                (cp -ln \"\$d\"/blobs/sha256/* '$DEPLOY_PATH/.images/blobs/sha256/' 2>/dev/null || true); \
            done; echo \"Couches disponibles sur le VPS : \$(ls '$DEPLOY_PATH/.images/blobs/sha256' | wc -l)\""

          # Ce qui reste à envoyer (couches absentes du VPS), pour suivre la
          # reprise d'un transfert d'un déploiement à l'autre.
          rsync -rn --size-only --timeout=120 --out-format='%l %n' \
            -e "$SSH" /tmp/images/blobs/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/.images/blobs/" \
            | awk '$1 ~ /^[0-9]+$/ && $2 !~ /\/$/ { n++; t += $1; printf "  à envoyer : %s (%.1f Mo)\n", $2, $1 / 1048576 }
                   END { printf "Reste à envoyer : %d couche(s), %.1f Mo\n", n, t / 1048576 }' || true

          start=$(date +%s)
          sent=false
          for attempt in 1 2 3 4; do
            echo "Transfert des couches, essai $attempt…"
            # --size-only : une couche porte son empreinte comme nom, même nom
            # et même taille = même contenu. Les métadonnées (index.json…)
            # sont, elles, comparées au contenu.
            if rsync -rz --size-only --delete --partial-dir=.rsync-partial --timeout=120 --info=stats1,progress2 --no-inc-recursive \
                 -e "$SSH" /tmp/images/blobs/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/.images/blobs/" \
               && rsync -rz --checksum --exclude=blobs --timeout=120 \
                 -e "$SSH" /tmp/images/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/.images/"; then
              sent=true
              break
            fi
            echo "Transfert interrompu, reprise dans 10 s."
            sleep 10
          done
          if [ "$sent" != true ]; then
            echo "::error::Transfert des images vers le VPS impossible (réseau). Relancer le déploiement reprendra là où il s'est arrêté."
            exit 1
          fi
          echo "Transfert terminé en $(( $(date +%s) - start )) s."

          start=$(date +%s)
          rc=0
          timeout 600 $SSH "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH/.images' && docker info --format 'Docker {{.ServerVersion}}' && tar --exclude=.rsync-partial -cf - . | docker load" \
            || rc=$?
          if [ "$rc" -ne 0 ]; then
            # 124 = délai de 10 min dépassé.
            echo "::error::docker load bloqué ou en échec sur le VPS (code $rc)."
            exit 1
          fi
          echo "Images chargées en $(( $(date +%s) - start )) s."

      - name: Relancer la pile
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' \
             && docker compose -f docker-compose.prod.yml up -d --no-build --remove-orphans \
             && docker image prune -f"

      - name: Vérifier le site
        run: |
          for attempt in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$DEPLOY_URL") || code=000
            echo "Tentative $attempt : HTTP $code"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "Le site ne répond pas en 200 après le déploiement."
          exit 1
