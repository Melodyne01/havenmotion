name: Deploy prod

# Déploiement production : chaque poussée sur master (ou main) livre la pile
# sur https://heavenmotion.be/ (mécanique dans deploy-stack.yml).
on:
  push:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  prod:
    uses: ./.github/workflows/deploy-stack.yml
    secrets: inherit
    with:
      env_name: production
      deploy_path: /opt/havenmotion
      site_url: https://heavenmotion.be/
      site_origin: https://heavenmotion.be
      allowed_hosts: heavenmotion.be,www.heavenmotion.be,localhost
      image_tag: prod
      web_port: '4000'
