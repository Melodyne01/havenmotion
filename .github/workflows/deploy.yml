name: Deploy

# Déploiement automatique : chaque poussée sur master (ou main) reconstruit
# les images sur le VPS et relance la pile docker compose.
#
# Pré-requis côté dépôt (Settings → Secrets and variables → Actions) :
#   - VPS_SSH_KEY : clé privée SSH du compte de déploiement.
# Pré-requis côté serveur :
#   - Docker + le plugin compose installés.
#   - Un fichier /opt/havenmotion/.env complété à partir de .env.example
#     (mots de passe Postgres, clé JWT, SMTP…). Jamais dans le dépôt.
#   - Le reverse proxy de l'hôte pointe vers 127.0.0.1:4000 (conteneur web).
on:
  push:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  DEPLOY_HOST: 195.35.1.21
  DEPLOY_USER: deploy
  DEPLOY_PATH: /opt/havenmotion
  DEPLOY_URL: https://havenmotion.beetee.be/

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Préparer la clé SSH
        run: |
          if [ -z "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "::error::Le secret VPS_SSH_KEY est absent ou vide."
            echo "::error::Ajoutez la clé privée SSH du compte de déploiement dans"
            echo "::error::Settings → Secrets and variables → Actions → New repository secret."
            exit 1
          fi
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Synchroniser les sources vers le VPS
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH'"
          rsync -az --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='dist' \
            --exclude='.env' \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

      # Premier passage : génère le .env sur le serveur (secrets créés sur
      # place, jamais dans les logs). Les identifiants du backoffice sont
      # écrits dans /opt/havenmotion/BACKOFFICE-ACCES.txt (lisible en SSH).
      - name: Préparer l'environnement serveur
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'REMOTE'
          set -eu
          cd "$DEPLOY_PATH"
          if [ -f .env ]; then
            echo ".env déjà présent, rien à faire."
            exit 0
          fi
          ADMIN_PWD="Vnl-$(openssl rand -hex 6)!"
          cat > .env <<ENV
          POSTGRES_PASSWORD=$(openssl rand -hex 24)
          JWT_SIGNING_KEY=$(openssl rand -base64 48 | tr -d '\n')
          SMTP_HOST=localhost
          SMTP_PORT=587
          SMTP_USERNAME=
          SMTP_PASSWORD=
          MAIL_FROM=no-reply@havenmotion.beetee.be
          ADMIN_EMAIL=admin@studiovnl.fr
          ADMIN_PASSWORD=$ADMIN_PWD
          SITE_ORIGIN=https://havenmotion.beetee.be
          ALLOWED_HOSTS=havenmotion.beetee.be,localhost
          ENV
          chmod 600 .env
          printf 'Backoffice : admin@studiovnl.fr / %s\n' "$ADMIN_PWD" > BACKOFFICE-ACCES.txt
          chmod 600 BACKOFFICE-ACCES.txt
          echo ".env généré ; identifiants backoffice dans $DEPLOY_PATH/BACKOFFICE-ACCES.txt"
          REMOTE

      - name: Reconstruire et relancer la pile
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' \
             && docker compose -f docker-compose.prod.yml up -d --build --remove-orphans \
             && docker image prune -f"

      - name: Vérifier le site
        run: |
          for attempt in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$DEPLOY_URL") || code=000
            echo "Tentative $attempt : HTTP $code"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "Le site ne répond pas en 200 après le déploiement."
          exit 1
