name: Deploy dev

# Déploiement de l'environnement de développement : chaque poussée sur develop
# livre une pile séparée (/opt/havenmotion-dev, images vnl-*:dev, port 4100)
# sur https://dev.heavenmotion.be/ (mécanique dans deploy-stack.yml).
#
# Pré-requis côté hôte : entrée DNS dev.heavenmotion.be → 195.35.1.21 et un
# vhost nginx dev.heavenmotion.be → 127.0.0.1:4100 avec son certificat.
on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  dev:
    uses: ./.github/workflows/deploy-stack.yml
    secrets: inherit
    with:
      env_name: dev
      deploy_path: /opt/havenmotion-dev
      site_url: https://dev.heavenmotion.be/
      site_origin: https://dev.heavenmotion.be
      allowed_hosts: dev.heavenmotion.be,localhost
      image_tag: dev
      web_port: '4100'
