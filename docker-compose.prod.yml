# Production : le conteneur web (SSR) est l'unique point d'entrée ; il sert le
# site et relaie /api et /media vers l'API. Le reverse proxy de l'hôte (nginx,
# caddy…) pointe vers web:4000. Les secrets viennent d'un fichier `.env` posé
# sur le serveur — jamais dans le dépôt.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: studiovnl
      POSTGRES_USER: studiovnl
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U studiovnl']
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: vnl-api:prod
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=studiovnl;Username=studiovnl;Password=${POSTGRES_PASSWORD}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY manquant}
      Email__Host: ${SMTP_HOST:?SMTP_HOST manquant}
      Email__Port: ${SMTP_PORT:-587}
      Email__UseSsl: 'true'
      Email__UserName: ${SMTP_USERNAME:-}
      Email__Password: ${SMTP_PASSWORD:-}
      Email__FromAddress: ${MAIL_FROM:-no-reply@heavenmotion.be}
      Seed__AdminEmail: ${ADMIN_EMAIL:-admin@studiovnl.fr}
      Seed__AdminPassword: ${ADMIN_PASSWORD:-}
      MediaStorage__Provider: LocalDisk
      MediaStorage__LocalDisk__RootPath: /data/media
      Cors__AllowedOrigins__0: ${SITE_ORIGIN:-https://heavenmotion.be}
    volumes:
      - media-data:/data/media

  web:
    image: vnl-web:prod
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      PORT: '4000'
      VNL_ALLOWED_HOSTS: ${ALLOWED_HOSTS:-heavenmotion.be,www.heavenmotion.be,localhost}
      VNL_API_BASE_URL: http://api:5080/api
      VNL_API_PROXY_TARGET: http://api:5080
      VNL_PUBLIC_API_BASE_URL: /api
      VNL_SITE_ORIGIN: ${SITE_ORIGIN:-https://heavenmotion.be}
    ports:
      - '127.0.0.1:4000:4000'

volumes:
  postgres-data:
  media-data:
